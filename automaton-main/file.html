<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLANACLAWD 🔥</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #0a0a0a;
      font-family: system-ui, sans-serif;
    }
    canvas {
      border: 8px solid #3f1f1f;
      border-radius: 12px;
      background: #1a0f0f;
    }
    .header {
      position: absolute;
      top: 20px;
      text-align: center;
      color: white;
    }
    .header h1 {
      margin: 0;
      font-size: 28px;
      color: #ff4d00;
      text-shadow: 0 0 20px #ff4d00;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>SOLANACLAWD 🔥</h1>
    <p style="margin: 5px 0 0; color: #888;">Score: <span id="score">0</span></p>
  </div>

  <canvas id="game" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const gridSize = 20;
    const tileCount = 20;

    let snake = [{x: 10, y: 10}];
    let velocity = {x: 1, y: 0};
    let food = {x: 15, y: 10};
    let score = 0;
    let gameOver = false;
    let gameInterval = null;

    function drawFlame(x, y, intensity = 1) {
      ctx.fillStyle = `rgba(255, ${80 + Math.random() * 80}, 0, ${intensity})`;
      ctx.fillRect(x + 2, y + 2, gridSize - 4, gridSize - 4);
    }

    function draw() {
      ctx.fillStyle = '#1a0f0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw burning body
      for (let i = 1; i < snake.length; i++) {
        const seg = snake[i];
        ctx.fillStyle = '#5c1f00';
        ctx.fillRect(seg.x * gridSize, seg.y * gridSize, gridSize - 2, gridSize - 2);
        
        // Fire effect
        ctx.fillStyle = '#ff4500';
        ctx.fillRect(seg.x * gridSize + 4, seg.y * gridSize + 4, gridSize - 10, gridSize - 10);
      }

      // Draw flaming head
      const head = snake[0];
      const hx = head.x * gridSize;
      const hy = head.y * gridSize;

      // Head base
      ctx.fillStyle = '#3f1f1f';
      ctx.fillRect(hx, hy, gridSize - 2, gridSize - 2);

      // Fire on head
      ctx.fillStyle = '#ff4500';
      ctx.fillRect(hx + 3, hy + 3, gridSize - 8, gridSize - 8);

      // Eyes (glowing)
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(hx + 5, hy + 5, 4, 4);
      ctx.fillRect(hx + 12, hy + 5, 4, 4);

      // Draw burning food
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
      ctx.fillStyle = '#ffaa00';
      ctx.fillRect(food.x * gridSize + 4, food.y * gridSize + 4, gridSize - 10, gridSize - 10);

      document.getElementById('score').innerText = score;
    }

    function update() {
      if (gameOver) return;

      const head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        endGame();
        return;
      }

      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          endGame();
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        placeFood();
      } else {
        snake.pop();
      }
    }

    function placeFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      for (let segment of snake) {
        if (segment.x === food.x && segment.y === food.y) {
          placeFood();
          return;
        }
      }
    }

    function endGame() {
      gameOver = true;
      clearInterval(gameInterval);

      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ff4500';
      ctx.font = 'bold 28px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('SOLANACLAWD BURNED', canvas.width / 2, canvas.height / 2 - 20);

      ctx.fillStyle = '#fff';
      ctx.font = '20px system-ui';
      ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 25);
      ctx.fillText('Press SPACE to restart', canvas.width / 2, canvas.height / 2 + 60);
    }

    function gameLoop() {
      update();
      draw();
    }

    function startGame() {
      snake = [{x: 10, y: 10}];
      velocity = {x: 1, y: 0};
      score = 0;
      gameOver = false;
      placeFood();

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, 130);
    }

    document.addEventListener('keydown', e => {
      if (gameOver && e.key === ' ') {
        startGame();
        return;
      }

      switch (e.key) {
        case 'ArrowUp': case 'w':
          if (velocity.y !== 1) velocity = {x: 0, y: -1};
          break;
        case 'ArrowDown': case 's':
          if (velocity.y !== -1) velocity = {x: 0, y: 1};
          break;
        case 'ArrowLeft': case 'a':
          if (velocity.x !== 1) velocity = {x: -1, y: 0};
          break;
        case 'ArrowRight': case 'd':
          if (velocity.x !== -1) velocity = {x: 1, y: 0};
          break;
      }
    });

    startGame();
    draw();
  </script>
</body>
</html>
